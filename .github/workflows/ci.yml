name: CI

'on':
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/**
      - requirements-ci.txt
      - lib/**
      - scripts/**
      - tests/**
      - mcp-servers/**
      - tools/scripts/**
      - projects/**/scripts/**
      - .gitmodules
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/**
      - requirements-ci.txt
      - lib/**
      - scripts/**
      - tests/**
      - mcp-servers/**
      - tools/scripts/**
      - projects/**/scripts/**
      - .gitmodules

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stable-tests:
    name: Stable Tests
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run stable test suite
        run: bash scripts/ci/run_stable_tests.sh
