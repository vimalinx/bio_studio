[project]
name = "bio-lab-mcp"
version = "0.1.0"
description = "Bio Lab MCP Server - 提供工作区项目发现与验证能力"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mcp>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
bio-lab-mcp = "lab_server:main"
