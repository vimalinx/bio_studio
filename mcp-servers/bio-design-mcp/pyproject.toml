[project]
name = "bio-design-mcp"
version = "0.1.0"
description = "Bio Design MCP Server - 提供 DNA/mRNA 设计与靶点评估能力"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mcp>=0.9.0",
    "biopython>=1.83",
    "numpy>=1.24.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
bio-design-mcp = "design_server:main"
